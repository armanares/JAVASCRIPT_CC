  <li><button  id="btn">KEY-EVENT</button></li>

  <button id="btn2"> key-event</button>
  <button id="btn3"> keyEvent</button>


</body>
<script>

  // attachEvent
  // jQuery
   document.querySelector('#a').addEventListener('click',function(e) {
    alert('yehhhhh')
   })
   document.querySelector('#b').addEventListener('click',function(e) {
    alert('babbby')
   })
   document.querySelector('#c').addEventListener('click',function(e) {
    alert('you')
   })
   document.querySelector('#d').addEventListener('click',function(e) {
    alert('clicked')
   })
   document.querySelector('#e').addEventListener('click',function(e) {
    alert(e.target.id)
   })

   // js key events
   document.querySelector('#btn').addEventListener('keydown' , (e)=> {
    alert(`keydown , ${event.key} , ${event.code}`)
    
   })

   document.querySelector('#btn2').addEventListener('keypress' , (e)=> {
    alert(`keypress , ${event.key} , ${event.code}`)
   })

   document.querySelector('#btn3').addEventListener('keyup' , (e)=> {
    alert(`keyup , ${event.key} , ${event.code}`)
   })





</script>
