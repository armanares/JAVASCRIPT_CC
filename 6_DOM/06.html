<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
</head>
<body>
  <div class="language">
    <li>javascript</li>
    <li>abc</li>
  </div>
  
</body>
<script>
  function addLanguage(lang) {
    const li = document.createElement('li');
    li.innerHTML =`${lang}`
    document.querySelector('.language').appendChild(li)
  }
  addLanguage('java')

  //effective method
  function addLanguage_ (lang) {
    const li = document.createElement('li')
    li.appendChild(document.createTextNode(lang))
    document.querySelector('.language').appendChild(li)
  }
  addLanguage_('python')
  addLanguage_('c++')
  addLanguage('mongoDB')
  addLanguage('react')

  //edit

  //1
  const secLanguage = document.querySelector('li:nth-child(2)')
  
  secLanguage.innerHTML="c programming"

  //2
  const newli = document.createElement('li')
  // newli.appendChild(document.createTextNode('c prog'))
  newli.textContent="c_prog"
  secLanguage.replaceWith(newli)

  //3
 const firstLanguage = document.querySelector('li:first-child')
 firstLanguage.outerHTML="<li>dango</li>"

 //remove
 const lastLang = document.querySelector('li:last-child')
 lastLang.remove()
</script>
</html>
